<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Livechanger — Real-time Audio Effects</title>
  <meta name="description" content="Transform any song in real time. Speed, reverb, bass, underwater, delay — all in your browser.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Courier New', Courier, monospace;
      --bg1: #0a1628;
      --bg2: #0d2240;
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.18);
      --glass-shine: rgba(255,255,255,0.22);
      --glass-deep: rgba(10,22,60,0.45);
      --accent: #38bdf8;
      --accent2: #7dd3fc;
      --accent-glow: rgba(56,189,248,0.35);
      --text: #e8f4ff;
      --text-sub: rgba(200,230,255,0.65);
      --text-muted: rgba(150,200,240,0.4);
      --toggle-off: rgba(255,255,255,0.12);
      --toggle-on: linear-gradient(135deg, #38bdf8, #0ea5e9);
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      background: var(--bg1);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(56,189,248,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(99,102,241,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 20%, rgba(14,165,233,0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a1628 0%, #0d2240 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 5rem;
    }

    /* Orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      top: -100px; left: -100px;
      background: radial-gradient(circle, rgba(56,189,248,0.12), transparent 70%);
    }
    body::after {
      width: 350px; height: 350px;
      bottom: -80px; right: -80px;
      background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%);
    }

    header {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.8rem;
    }

    .wordmark {
      font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em;
      text-shadow: 0 0 20px rgba(56,189,248,0.5), 0 2px 4px rgba(0,0,0,0.4);
      color: var(--text);
    }
    .wordmark .accent-word { color: var(--accent); }
    .wordmark .morph-letter { display: inline-block; position: relative; color: var(--text); }
    .wordmark .morph-letter .from { display: inline; transition: opacity 0.6s ease; }
    .wordmark .morph-letter .to { position: absolute; left: 0; opacity: 0; transition: opacity 0.6s ease; }

    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .tagline { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.04em; }
    .bpm-display { font-size: 0.68rem; color: var(--accent2); display: none; }

    /* Glass card */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 1px 0 var(--glass-shine) inset,
        0 -1px 0 rgba(0,0,0,0.2) inset;
    }

    /* Shine strip at top of card */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-shine), transparent);
      border-radius: 20px 20px 0 0;
    }

    /* Drop zone */
    .drop-zone {
      border: 1.5px dashed rgba(56,189,248,0.3);
      border-radius: 14px;
      padding: 1.8rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 1.25rem;
      background: rgba(56,189,248,0.04);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(56,189,248,0.1);
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }
    .drop-zone.has-file {
      border-style: solid;
      border-color: rgba(56,189,248,0.5);
      background: rgba(56,189,248,0.08);
      padding: 0.9rem;
    }
    .drop-icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
    .drop-label { font-size: 0.85rem; color: var(--text-sub); font-family: var(--font); }
    .drop-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; font-family: var(--font); }
    .file-name { font-size: 0.78rem; color: var(--accent); font-weight: 600; margin-top: 0.4rem; word-break: break-all; font-family: var(--font); }
    input[type="file"] { display: none; }

    /* Action buttons row */
    .actions-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 1rem;
    }
    .action-btn {
      font-family: var(--font);
      font-size: 0.72rem;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
      backdrop-filter: blur(8px);
    }
    .action-btn:hover {
      border-color: rgba(56,189,248,0.5);
      color: var(--accent);
      background: rgba(56,189,248,0.1);
      box-shadow: 0 0 12px rgba(56,189,248,0.2);
    }

    /* Saved preset buttons */
    .saved-preset { position: relative; padding-right: 24px; }
    .saved-preset .del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 0.65rem; opacity: 0.5; cursor: pointer; }
    .saved-preset .del:hover { opacity: 1; color: #f87171; }
    .saved-preset.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.12); }

    /* Toggle switches */
    .toggles-row {
      display: flex; gap: 20px;
      margin-bottom: 1.25rem;
      padding: 10px 14px;
      background: rgba(0,0,0,0.15);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .toggle-item {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .toggle-label {
      font-family: var(--font);
      font-size: 0.75rem;
      color: var(--text-sub);
      user-select: none;
    }
    .toggle-switch {
      position: relative; width: 38px; height: 20px; flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--toggle-off);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.25s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: all 0.25s;
    }
    .toggle-switch input:checked + .toggle-track {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      border-color: rgba(56,189,248,0.5);
      box-shadow: 0 0 10px rgba(56,189,248,0.4);
    }
    .toggle-switch input:checked + .toggle-track::after {
      left: calc(100% - 16px);
      background: white;
    }
    .toggle-item:has(input:checked) .toggle-label { color: var(--accent2); }

    /* Play bar */
    .play-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.4rem; }
    .play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: linear-gradient(145deg, rgba(56,189,248,0.2), rgba(14,165,233,0.1));
      color: var(--text); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 1px 0 var(--glass-shine) inset;
      backdrop-filter: blur(8px);
    }
    .play-btn:hover { box-shadow: 0 0 20px var(--accent-glow), 0 4px 15px rgba(0,0,0,0.3); border-color: var(--accent); }
    .play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress-wrap { flex: 1; }
    .time { font-size: 0.68rem; color: var(--text-muted); margin-top: 5px; font-family: var(--font); }

    /* Range inputs */
    input[type="range"].horizontal {
      -webkit-appearance: none; width: 100%; height: 4px;
      border-radius: 2px; outline: none; cursor: pointer;
      background: rgba(255,255,255,0.1);
    }
    input[type="range"].horizontal::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff, var(--accent));
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow), 0 2px 4px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.4);
      transition: transform 0.1s;
    }
    input[type="range"].horizontal::-webkit-slider-thumb:hover { transform: scale(1.2); }

    input[type="range"].vertical {
      -webkit-appearance: slider-vertical;
      writing-mode: vertical-lr; direction: rtl;
      width: 4px; height: 150px; padding: 0; cursor: pointer;
      outline: none; background: rgba(255,255,255,0.1); border-radius: 2px; flex-shrink: 0;
    }
    input[type="range"].vertical::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff, var(--accent));
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow), 0 2px 4px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* Divider */
    .divider {
      border: none; height: 1px; margin: 0 0 1.2rem;
      background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    }

    /* Sliders section */
    .sliders-with-volume { display: flex; align-items: stretch; gap: 14px; }
    .sliders-col { flex: 1; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row label {
      font-size: 0.75rem; color: var(--text-sub); min-width: 72px;
      text-align: center; font-family: var(--font); letter-spacing: 0.02em;
    }
    .slider-val { font-size: 0.75rem; font-weight: 600; color: var(--accent2); min-width: 44px; text-align: right; font-family: var(--font); }

    /* Volume column */
    .volume-col { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; }
    .vol-label { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; font-family: var(--font); }
    .vol-icon { font-size: 0.9rem; }
    .vol-val { font-size: 0.68rem; font-weight: 600; color: var(--accent2); font-family: var(--font); }

    .status { font-size: 0.72rem; color: var(--text-muted); text-align: center; padding-top: 1rem; font-family: var(--font); }

    footer { position: relative; z-index: 1; margin-top: 1.5rem; font-size: 0.65rem; color: var(--text-muted); text-align: center; font-family: var(--font); letter-spacing: 0.05em; }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Li<span class="morph-letter" id="morphLetter"><span class="from">v</span><span class="to">f</span></span>e<span class="accent-word">changer</span></div>
  <div class="header-right">
    <div class="tagline">real-time audio effects</div>
    <div class="bpm-display" id="bpmDisplay">BPM: detecting...</div>
  </div>
</header>

<div class="card">
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="drop-icon">🎵</div>
    <div class="drop-label">Drop a song or tap to browse</div>
    <div class="drop-sub">MP3 · WAV · FLAC · OGG</div>
    <div class="file-name" id="fileName"></div>
  </div>
  <input type="file" id="fileInput" accept="audio/*">

  <div class="actions-row" id="actionsRow">
    <button class="action-btn" onclick="resetSliders()">Reset</button>
    <button class="action-btn" onclick="savePreset()">+ Save Preset</button>
  </div>

  <div class="toggles-row">
    <label class="toggle-item">
      <div class="toggle-switch">
        <input type="checkbox" id="loopToggle" onchange="toggleLoop(this.checked)">
        <div class="toggle-track"></div>
      </div>
      <span class="toggle-label">Loop</span>
    </label>
    <label class="toggle-item">
      <div class="toggle-switch">
        <input type="checkbox" id="pulseToggle" onchange="togglePulse(this.checked)" disabled>
        <div class="toggle-track"></div>
      </div>
      <span class="toggle-label" id="pulseLabel">Pulse</span>
    </label>
  </div>

  <div class="play-bar">
    <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>▶</button>
    <div class="progress-wrap">
      <input type="range" class="horizontal" id="progressBar" min="0" max="100" value="0" step="0.1" oninput="seek(this.value)">
      <div class="time" id="timeDisplay">0:00 / 0:00</div>
    </div>
  </div>

  <hr class="divider">

  <div class="sliders-with-volume">
    <div class="volume-col">
      <div class="vol-icon">🔊</div>
      <input type="range" class="vertical" id="volumeSlider" min="0" max="100" step="5" value="50" oninput="updateVolume(this.value)">
      <div class="vol-val" id="volVal">50%</div>
      <div class="vol-label">Vol</div>
    </div>
    <div class="sliders-col">
      <div class="slider-row">
        <label>Speed</label>
        <input type="range" class="horizontal" id="speedSlider" min="0.25" max="1.75" step="0.05" value="1" oninput="updateSpeed(this.value)">
        <span class="slider-val" id="speedVal">1.00x</span>
      </div>
      <div class="slider-row">
        <label>Reverb</label>
        <input type="range" class="horizontal" id="reverbSlider" min="0" max="100" step="5" value="0" oninput="updateReverb(this.value)">
        <span class="slider-val" id="reverbVal">0%</span>
      </div>
      <div class="slider-row">
        <label>Bass</label>
        <input type="range" class="horizontal" id="bassSlider" min="-20" max="20" step="1" value="0" oninput="updateBass(this.value)">
        <span class="slider-val" id="bassVal">0 dB</span>
      </div>
      <div class="slider-row">
        <label>Underwater</label>
        <input type="range" class="horizontal" id="muffleSlider" min="0" max="100" step="5" value="0" oninput="updateMuffle(this.value)">
        <span class="slider-val" id="muffleVal">0%</span>
      </div>
      <div class="slider-row">
        <label>Delay</label>
        <input type="range" class="horizontal" id="delaySlider" min="0" max="100" step="5" value="0" oninput="updateDelay(this.value)">
        <span class="slider-val" id="delayVal">0%</span>
      </div>
      <div class="slider-row">
        <label>Bitcrush</label>
        <input type="range" class="horizontal" id="bitcrushSlider" min="0" max="100" step="5" value="0" oninput="updateBitcrush(this.value)">
        <span class="slider-val" id="bitcrushVal">0%</span>
      </div>
    </div>
  </div>

  <div class="status" id="status">Load a song to start</div>
</div>

<footer>livechangermusic.com</footer>

<script>
  let audioCtx, sourceNode, gainNode, bassFilter, muffleFilter, convolverNode, dryNode, wetNode, delayNode, delayFeedback, delayWet, delayDry, buffer;
  let isPlaying = false, startedAt = 0, pausedAt = 0;
  let speed = 1, reverbAmount = 0, bassGain = 0, muffleAmount = 0, delayAmount = 0, userVolume = 0.5, bitcrushAmount = 0;
  let reverbBuffer = null, animFrame, isSeeking = false;
  let bitcrushNode = null;
  let originalBuffer = null;
  let bitcrushTimer = null;

  const playBtn = document.getElementById('playBtn');
  const progressBar = document.getElementById('progressBar');
  const timeDisplay = document.getElementById('timeDisplay');
  const status = document.getElementById('status');

  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (file) loadFile(file);
  });

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('audio/')) loadFile(file);
  });

  async function loadFile(file) {
    document.getElementById('fileName').textContent = file.name;
    dropZone.classList.add('has-file');
    document.querySelector('.drop-icon').style.display = 'none';
    document.querySelector('.drop-label').style.display = 'none';
    document.querySelector('.drop-sub').style.display = 'none';
    status.textContent = 'Loading...';
    if (isPlaying) stopAudio();
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    pausedAt = 0;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await file.arrayBuffer();
    buffer = await audioCtx.decodeAudioData(ab);
    originalBuffer = buffer;
    bitcrushAmount = 0;
    document.getElementById('bitcrushSlider').value = 0;
    document.getElementById('bitcrushVal').textContent = '0%';
    reverbBuffer = createReverbBuffer(audioCtx);
    buildGraph();
    playBtn.disabled = false;
    status.textContent = 'Ready — hit play';
    progressBar.value = 0;
    updateTimeDisplay(0);
    const bpmDisplay = document.getElementById('bpmDisplay');
    bpmDisplay.style.display = 'block';
    bpmDisplay.textContent = 'BPM: detecting...';
    detectBPM(buffer).then(bpm => {
      detectedBPM = bpm;
      bpmDisplay.textContent = 'BPM: ' + bpm;
      document.getElementById('pulseToggle').disabled = false;
    });
  }

  function createReverbBuffer(ctx) {
    const len = ctx.sampleRate * 2.5;
    const rb = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = rb.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    return rb;
  }

  function muffleFreq(pct) {
    if (pct === 0) return 20000;
    return 20000 * Math.pow(300 / 20000, pct / 100);
  }

  function effectiveGain() {
    const base = userVolume * 2.0;
    const reverbBoost = (reverbAmount / 100) * 0.8;
    const muffleBoost = (muffleAmount / 100) * 0.8;
    return Math.min(base + reverbBoost + muffleBoost, 3.5);
  }

  function buildGraph() {
    gainNode = audioCtx.createGain(); gainNode.gain.value = effectiveGain();
    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 150; bassFilter.gain.value = bassGain;
    bitcrushNode = audioCtx.createGain(); bitcrushNode.gain.value = 1;
    muffleFilter = audioCtx.createBiquadFilter();
    muffleFilter.type = 'lowpass'; muffleFilter.frequency.value = muffleFreq(muffleAmount); muffleFilter.Q.value = 0.5;
    delayNode = audioCtx.createDelay(2.0); delayNode.delayTime.value = 0.35;
    delayFeedback = audioCtx.createGain(); delayFeedback.gain.value = 0.45;
    delayWet = audioCtx.createGain(); delayWet.gain.value = delayAmount / 100;
    delayDry = audioCtx.createGain(); delayDry.gain.value = 1;
    convolverNode = audioCtx.createConvolver(); convolverNode.buffer = reverbBuffer;
    dryNode = audioCtx.createGain(); dryNode.gain.value = 1 - reverbAmount / 100;
    wetNode = audioCtx.createGain(); wetNode.gain.value = reverbAmount / 100;
    gainNode.connect(bassFilter);
    bassFilter.connect(bitcrushNode);
    bitcrushNode.connect(muffleFilter);
    muffleFilter.connect(delayDry); muffleFilter.connect(delayNode);
    delayNode.connect(delayFeedback); delayFeedback.connect(delayNode);
    delayNode.connect(delayWet);
    delayDry.connect(dryNode); delayDry.connect(convolverNode);
    delayWet.connect(dryNode); delayWet.connect(convolverNode);
    convolverNode.connect(wetNode);
    dryNode.connect(audioCtx.destination); wetNode.connect(audioCtx.destination);
  }

  function startAudio(offset) {
    if (!buffer || !audioCtx) return;
    if (sourceNode) { try { sourceNode.disconnect(); sourceNode.stop(); } catch(e){} sourceNode = null; }
    buildGraph();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = buffer; sourceNode.playbackRate.value = speed;
    sourceNode.loop = loopEnabled;
    sourceNode.connect(gainNode); sourceNode.start(0, offset);
    startedAt = audioCtx.currentTime - offset / speed;
    isPlaying = true; playBtn.textContent = '⏸'; status.textContent = 'Playing';
    sourceNode.onended = () => {
      if (isPlaying && loopEnabled) {
        startedAt = audioCtx.currentTime;
        pausedAt = 0; progressBar.value = 0; updateTimeDisplay(0);
        return;
      }
      if (isPlaying) {
        isPlaying = false; pausedAt = 0; playBtn.textContent = '▶';
        cancelAnimationFrame(animFrame); progressBar.value = 0;
        updateTimeDisplay(0); status.textContent = 'Ready — hit play';
      }
    };
    updateProgress();
  }

  function stopAudio() {
    isPlaying = false; cancelAnimationFrame(animFrame);
    if (sourceNode) { sourceNode.onended = null; try { sourceNode.stop(); } catch(e){} sourceNode = null; }
    playBtn.textContent = '▶';
  }

  function togglePlay() {
    if (!buffer) return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (isPlaying) { pausedAt = (audioCtx.currentTime - startedAt) * speed; stopAudio(); status.textContent = 'Paused'; }
    else startAudio(pausedAt);
  }

  progressBar.addEventListener('mousedown', () => { isSeeking = true; });
  progressBar.addEventListener('touchstart', () => { isSeeking = true; }, {passive:true});
  progressBar.addEventListener('change', () => { isSeeking = false; });

  function seek(val) {
    if (!buffer) return;
    const offset = (val / 100) * buffer.duration;
    pausedAt = offset; updateTimeDisplay(offset);
    if (isPlaying) { stopAudio(); startAudio(offset); }
  }

  function updateProgress() {
    if (!isPlaying || !buffer) return;
    const realElapsed = (audioCtx.currentTime - startedAt) * speed;
    const clamped = Math.min(realElapsed, buffer.duration);
    if (!isSeeking) progressBar.value = (clamped / buffer.duration * 100).toFixed(2);
    updateTimeDisplay(clamped);
    animFrame = requestAnimationFrame(updateProgress);
  }

  function updateTimeDisplay(elapsed) {
    const fmt = s => { const m = Math.floor(s/60); const sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; };
    const dur = buffer ? buffer.duration : 0;
    timeDisplay.textContent = fmt(Math.min(elapsed, dur)) + ' / ' + fmt(dur);
  }

  function updateVolume(val) {
    userVolume = parseInt(val) / 100;
    document.getElementById('volVal').textContent = val + '%';
    if (gainNode) gainNode.gain.value = effectiveGain();
  }

  function updateSpeed(val) {
    speed = parseFloat(val);
    document.getElementById('speedVal').textContent = speed.toFixed(2) + 'x';
    if (isPlaying && sourceNode) {
      const currentRealPos = (audioCtx.currentTime - startedAt) * speed;
      sourceNode.playbackRate.value = speed;
      startedAt = audioCtx.currentTime - currentRealPos / speed;
    }
  }

  function updateReverb(val) {
    reverbAmount = parseInt(val);
    document.getElementById('reverbVal').textContent = reverbAmount + '%';
    if (dryNode) dryNode.gain.value = 1 - reverbAmount / 100;
    if (wetNode) wetNode.gain.value = reverbAmount / 100;
    if (gainNode) gainNode.gain.value = effectiveGain();
  }

  function updateBass(val) {
    bassGain = parseInt(val);
    document.getElementById('bassVal').textContent = (bassGain >= 0 ? '+' : '') + bassGain + ' dB';
    if (bassFilter) bassFilter.gain.value = bassGain;
  }

  function updateMuffle(val) {
    muffleAmount = parseInt(val);
    document.getElementById('muffleVal').textContent = muffleAmount + '%';
    if (muffleFilter) muffleFilter.frequency.value = muffleFreq(muffleAmount);
    if (gainNode) gainNode.gain.value = effectiveGain();
  }

  function updateDelay(val) {
    delayAmount = parseInt(val);
    document.getElementById('delayVal').textContent = delayAmount + '%';
    if (delayWet) delayWet.gain.value = delayAmount / 100;
  }

  let originalBuffer2 = null;
  async function resampleBitcrush(pct) {
    if (!originalBuffer) return;
    if (isPlaying && audioCtx) {
      pausedAt = Math.round((audioCtx.currentTime - startedAt) * speed * 10) / 10;
    }
    const processStart = audioCtx ? audioCtx.currentTime : 0;
    if (pct === 0) {
      buffer = originalBuffer;
      const resumePos = Math.min(pausedAt, buffer.duration - 0.01);
      const wasPlaying = isPlaying;
      if (wasPlaying) stopAudio();
      pausedAt = resumePos;
      if (wasPlaying) startAudio(resumePos);
      return;
    }
    status.textContent = 'Processing...';
    const factor = 1 + (pct / 100) * 11;
    const sr = originalBuffer.sampleRate;
    const numCh = originalBuffer.numberOfChannels;
    const origLen = originalBuffer.length;
    const smallLen = Math.ceil(origLen / factor);
    const offCtx1 = new OfflineAudioContext(numCh, smallLen, sr);
    const src1 = offCtx1.createBufferSource();
    src1.buffer = originalBuffer; src1.playbackRate.value = factor;
    src1.connect(offCtx1.destination); src1.start();
    const fastBuf = await offCtx1.startRendering();
    const offCtx2 = new OfflineAudioContext(numCh, origLen, sr);
    const src2 = offCtx2.createBufferSource();
    src2.buffer = fastBuf; src2.playbackRate.value = 1 / factor;
    src2.connect(offCtx2.destination); src2.start();
    const crushedBuf = await offCtx2.startRendering();
    buffer = crushedBuf;
    status.textContent = isPlaying ? 'Playing' : 'Ready — hit play';
    const processingElapsed = audioCtx ? (audioCtx.currentTime - processStart) : 0;
    const resumePos = Math.min(pausedAt + processingElapsed, buffer.duration - 0.01);
    const wasPlaying = isPlaying;
    if (wasPlaying) stopAudio();
    pausedAt = resumePos;
    if (wasPlaying) startAudio(resumePos);
  }

  function updateBitcrush(val) {
    bitcrushAmount = parseInt(val);
    document.getElementById('bitcrushVal').textContent = bitcrushAmount + '%';
    clearTimeout(bitcrushTimer);
    bitcrushTimer = setTimeout(() => resampleBitcrush(bitcrushAmount), 400);
  }

  // Loop
  let loopEnabled = false;
  function toggleLoop(checked) {
    loopEnabled = checked;
    if (sourceNode) sourceNode.loop = loopEnabled;
  }

  // BPM detection
  let detectedBPM = 120;
  async function detectBPM(buf) {
    const sr = buf.sampleRate;
    const data = buf.getChannelData(0);
    const windowSize = Math.floor(sr * 0.01);
    const energies = [];
    for (let i = 0; i < data.length - windowSize; i += windowSize) {
      let e = 0;
      for (let j = 0; j < windowSize; j++) e += data[i+j] * data[i+j];
      energies.push(e / windowSize);
    }
    const threshold = energies.reduce((a,b) => a+b, 0) / energies.length * 1.5;
    const peaks = [];
    const minGap = Math.floor(sr * 0.3 / windowSize);
    let lastPeak = -minGap;
    for (let i = 1; i < energies.length - 1; i++) {
      if (energies[i] > threshold && energies[i] > energies[i-1] && energies[i] > energies[i+1] && i - lastPeak > minGap) {
        peaks.push(i); lastPeak = i;
      }
    }
    if (peaks.length < 4) return 120;
    const intervals = [];
    for (let i = 1; i < Math.min(peaks.length, 32); i++) intervals.push((peaks[i] - peaks[i-1]) * windowSize / sr);
    const avgInterval = intervals.reduce((a,b) => a+b, 0) / intervals.length;
    let b = Math.round(60 / avgInterval);
    while (b < 60) b *= 2;
    while (b > 180) b /= 2;
    return b;
  }

  // Pulse
  let pulseEnabled = false;
  let pulseRaf = null;
  let pulsePhase = 'in';
  let pulsePhaseStart = null;

  function togglePulse(checked) {
    pulseEnabled = checked;
    if (pulseEnabled) {
      pulsePhase = 'in';
      pulsePhaseStart = performance.now();
      runPulse();
    } else {
      cancelAnimationFrame(pulseRaf);
      document.getElementById('muffleSlider').value = 0;
      updateMuffle(0);
    }
  }

  function runPulse() {
    if (!pulseEnabled) return;
    const now = performance.now();
    const effectiveBPM = detectedBPM * speed;
    const beatMs = (60 / effectiveBPM) * 1000;
    const inDuration = beatMs * 32;
    const holdDuration = beatMs * 12;
    const outDuration = beatMs * 16;
    const elapsed = now - pulsePhaseStart;
    let muffleVal;
    if (pulsePhase === 'in') {
      muffleVal = Math.min((elapsed / inDuration) * 100, 100);
      if (elapsed >= inDuration) { pulsePhase = 'hold'; pulsePhaseStart = now; }
    } else if (pulsePhase === 'hold') {
      muffleVal = 100;
      if (elapsed >= holdDuration) { pulsePhase = 'out'; pulsePhaseStart = now; }
    } else {
      muffleVal = Math.max(100 - (elapsed / outDuration) * 100, 0);
      if (elapsed >= outDuration) { pulsePhase = 'in'; pulsePhaseStart = now; }
    }
    muffleVal = Math.round(muffleVal / 5) * 5;
    document.getElementById('muffleSlider').value = muffleVal;
    updateMuffle(muffleVal);
    pulseRaf = requestAnimationFrame(runPulse);
  }

  // Saved presets
  let savedPresets = [];
  try { savedPresets = JSON.parse(localStorage.getItem('lc_presets') || '[]'); } catch(e) {}

  function getCurrentValues() {
    return {
      speed: parseFloat(document.getElementById('speedSlider').value),
      reverb: parseInt(document.getElementById('reverbSlider').value),
      bass: parseInt(document.getElementById('bassSlider').value),
      muffle: parseInt(document.getElementById('muffleSlider').value),
      delay: parseInt(document.getElementById('delaySlider').value),
      bitcrush: parseInt(document.getElementById('bitcrushSlider').value),
      volume: parseInt(document.getElementById('volumeSlider').value),
    };
  }

  function applyValues(p) {
    document.getElementById('speedSlider').value = p.speed;
    document.getElementById('reverbSlider').value = p.reverb;
    document.getElementById('bassSlider').value = p.bass;
    document.getElementById('muffleSlider').value = p.muffle;
    document.getElementById('delaySlider').value = p.delay;
    document.getElementById('bitcrushSlider').value = p.bitcrush;
    if (p.volume !== undefined) { document.getElementById('volumeSlider').value = p.volume; updateVolume(p.volume); }
    updateSpeed(p.speed); updateReverb(p.reverb); updateBass(p.bass);
    updateMuffle(p.muffle); updateDelay(p.delay); updateBitcrush(p.bitcrush);
  }

  function resetSliders() {
    applyValues({ speed: 1, reverb: 0, bass: 0, muffle: 0, delay: 0, bitcrush: 0, volume: 50 });
    document.querySelectorAll('.saved-preset').forEach(b => b.classList.remove('active'));
  }

  function savePreset() {
    const name = prompt('Name this preset:');
    if (!name || !name.trim()) return;
    const preset = { name: name.trim(), values: getCurrentValues() };
    savedPresets.push(preset);
    try { localStorage.setItem('lc_presets', JSON.stringify(savedPresets)); } catch(e) {}
    renderSavedPresets();
  }

  function deletePreset(idx) {
    savedPresets.splice(idx, 1);
    try { localStorage.setItem('lc_presets', JSON.stringify(savedPresets)); } catch(e) {}
    renderSavedPresets();
  }

  function renderSavedPresets() {
    const row = document.getElementById('actionsRow');
    row.querySelectorAll('.saved-preset').forEach(b => b.remove());
    savedPresets.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'action-btn saved-preset';
      btn.innerHTML = p.name + '<span class="del" onclick="event.stopPropagation();deletePreset(' + i + ')">✕</span>';
      btn.onclick = () => { applyValues(p.values); document.querySelectorAll('.saved-preset').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
      row.appendChild(btn);
    });
  }

  renderSavedPresets();

  // Logo morph v → f
  (function morphLogo() {
    const fromEl = document.querySelector('.morph-letter .from');
    const toEl = document.querySelector('.morph-letter .to');
    if (!fromEl || !toEl) return;
    function showF() { fromEl.style.opacity = '0'; toEl.style.opacity = '1'; setTimeout(showV, 1800); }
    function showV() { fromEl.style.opacity = '1'; toEl.style.opacity = '0'; setTimeout(showF, 3500); }
    setTimeout(showF, 3500);
  })();
</script>
</body>
</html>

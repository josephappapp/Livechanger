<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livechanger — Real-time Audio Effects</title>
  <meta name="description" content="Transform any song in real time. Speed, reverb, bass, muffle, delay — all in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Using Courier New, system monospace -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e;
      --border: #2a2a2a; --text: #f0f0f0; --text-muted: #666;
      --text-sub: #999; --accent: #6c63ff;
      --accent-dim: rgba(108,99,255,0.15); --accent-border: rgba(108,99,255,0.4);
    }
    body { font-family: 'Courier New', Courier, monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
    header { width: 100%; max-width: 520px; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2.5rem; }
    .wordmark { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; }
    .wordmark span { color: var(--accent); }
    .wordmark .morph-letter { color: var(--text); }
    .wordmark .morph-letter { display: inline-block; position: relative; }
    .wordmark .morph-letter .from,
    .wordmark .morph-letter .to { position: absolute; left: 0; transition: opacity 0.6s ease; }
    .wordmark .morph-letter .from { opacity: 1; position: relative; }
    .wordmark .morph-letter .to { opacity: 0; top: 0; }
    @keyframes morphVF {
      0%, 35%   { }
      40%, 60%  { }
      65%, 100% { }
    }
    .tagline { font-size: 0.75rem; color: var(--text-muted); }
    .outer { display: flex; align-items: flex-start; gap: 0; width: 100%; max-width: 520px; }
    .card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
    .drop-zone { border: 1.5px dashed var(--border); border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 1.5rem; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
    .drop-zone.has-file { border-style: solid; border-color: var(--accent-border); background: var(--accent-dim); padding: 1rem; }
    .drop-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .drop-label { font-size: 0.9rem; color: var(--text-sub); }
    .drop-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .file-name { font-size: 0.8rem; color: var(--accent); font-weight: 500; margin-top: 0.5rem; word-break: break-all; }
    input[type="file"] { display: none; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
    .preset-btn { font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; font-weight: 500; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-sub); cursor: pointer; transition: all 0.1s; }
    .preset-btn:hover { border-color: var(--accent-border); color: var(--text); }
    .preset-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .action-btn { border-color: var(--border); color: var(--text-sub); }
    .action-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
    .saved-preset { position: relative; padding-right: 26px; }
    .saved-preset .del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; opacity: 0.5; cursor: pointer; line-height: 1; }
    .saved-preset .del:hover { opacity: 1; color: #ff6b6b; }
    .play-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .play-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; flex-shrink: 0; }
    .play-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
    .play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress-wrap { flex: 1; }
    input[type="range"].horizontal { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
    input[type="range"].horizontal::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform 0.1s; }
    input[type="range"].horizontal::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .time { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 0 0 1.25rem; }
    .sliders-with-volume { display: flex; align-items: stretch; gap: 14px; }
    .sliders-col { flex: 1; }
    .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1.1rem; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row label { font-size: 0.8rem; color: var(--text-sub); min-width: 72px; text-align: center; }
    .slider-val { font-size: 0.8rem; font-weight: 500; color: var(--text); min-width: 46px; text-align: right; }
    .volume-col { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; }
    .vol-label { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .vol-icon { font-size: 0.95rem; }
    .vol-val { font-size: 0.7rem; font-weight: 500; color: var(--text); }
    input[type="range"].vertical { -webkit-appearance: slider-vertical; writing-mode: vertical-lr; direction: rtl; width: 4px; height: 150px; padding: 0; cursor: pointer; outline: none; background: var(--border); border-radius: 2px; flex-shrink: 0; }
    input[type="range"].vertical::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
    .status { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding-top: 1rem; }
    footer { margin-top: 2rem; font-size: 0.7rem; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Li<span class="morph-letter" id="morphLetter"><span class="from">v</span><span class="to">f</span></span>e<span>changer</span></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><div class="tagline">real-time audio effects</div><div class="tagline" id="bpmDisplay" style="display:none">BPM: detecting...</div></div>
</header>

<div class="outer">
  <div class="card">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">🎵</div>
      <div class="drop-label">Drop a song or tap to browse</div>
      <div class="drop-sub">MP3, WAV, FLAC, OGG</div>
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept="audio/*">

    <div class="presets" id="presetsRow">
      <button class="preset-btn action-btn" id="loopBtn" onclick="toggleLoop()">⟳ Loop</button>
      <button class="preset-btn action-btn" id="pulseBtn" onclick="togglePulse()" disabled>〜 Pulse</button>
      <button class="preset-btn action-btn" onclick="resetSliders()">Reset</button>
      <button class="preset-btn action-btn" onclick="savePreset()">+ Save Preset</button>
    </div>

    <div class="play-bar">
      <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>▶</button>
      <div class="progress-wrap">
        <input type="range" class="horizontal" id="progressBar" min="0" max="100" value="0" step="0.1" oninput="seek(this.value)">
        <div class="time" id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <hr class="divider">

    <div class="sliders-with-volume">
      <div class="volume-col">
        <div class="vol-icon">🔊</div>
        <input type="range" class="vertical" id="volumeSlider" min="0" max="100" step="5" value="50" oninput="updateVolume(this.value)">
        <div class="vol-val" id="volVal">50%</div>
        <div class="vol-label">Vol</div>
      </div>

      <div class="sliders-col">
        <div class="slider-row">
          <label>Speed</label>
          <input type="range" class="horizontal" id="speedSlider" min="0.25" max="1.75" step="0.05" value="1" oninput="updateSpeed(this.value)">
          <span class="slider-val" id="speedVal">1.00x</span>
        </div>
        <div class="slider-row">
          <label>Reverb</label>
          <input type="range" class="horizontal" id="reverbSlider" min="0" max="100" step="5" value="0" oninput="updateReverb(this.value)">
          <span class="slider-val" id="reverbVal">0%</span>
        </div>
        <div class="slider-row">
          <label>Bass</label>
          <input type="range" class="horizontal" id="bassSlider" min="-20" max="20" step="1" value="0" oninput="updateBass(this.value)">
          <span class="slider-val" id="bassVal">0 dB</span>
        </div>
        <div class="slider-row">
          <label>Underwater</label>
          <input type="range" class="horizontal" id="muffleSlider" min="0" max="100" step="5" value="0" oninput="updateMuffle(this.value)">
          <span class="slider-val" id="muffleVal">0%</span>
        </div>
        <div class="slider-row">
          <label>Delay</label>
          <input type="range" class="horizontal" id="delaySlider" min="0" max="100" step="5" value="0" oninput="updateDelay(this.value)">
          <span class="slider-val" id="delayVal">0%</span>
        </div>
        <div class="slider-row">
          <label>Bitcrush</label>
          <input type="range" class="horizontal" id="bitcrushSlider" min="0" max="100" step="5" value="0" oninput="updateBitcrush(this.value)">
          <span class="slider-val" id="bitcrushVal">0%</span>
        </div>
      </div>
    </div>

    <div class="status" id="status">Load a song to start</div>
  </div>
</div>

<footer>livechangermusic.com</footer>

<script>
  let audioCtx, sourceNode, gainNode, bassFilter, muffleFilter, convolverNode, dryNode, wetNode, delayNode, delayFeedback, delayWet, delayDry, buffer;
  let isPlaying = false, startedAt = 0, pausedAt = 0;
  let speed = 1, reverbAmount = 0, bassGain = 0, muffleAmount = 0, delayAmount = 0, userVolume = 0.5, bitcrushAmount = 0;
  let reverbBuffer = null, animFrame, isSeeking = false;
  let bitcrushNode = null;

  const playBtn = document.getElementById('playBtn');
  const progressBar = document.getElementById('progressBar');
  const timeDisplay = document.getElementById('timeDisplay');
  const status = document.getElementById('status');

  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (file) loadFile(file);
  });

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('audio/')) loadFile(file);
  });

  async function loadFile(file) {
    document.getElementById('fileName').textContent = file.name;
    dropZone.classList.add('has-file');
    document.querySelector('.drop-icon').style.display = 'none';
    document.querySelector('.drop-label').style.display = 'none';
    document.querySelector('.drop-sub').style.display = 'none';
    status.textContent = 'Loading...';
    if (isPlaying) stopAudio();
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    pausedAt = 0;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await file.arrayBuffer();
    buffer = await audioCtx.decodeAudioData(ab);
    originalBuffer = buffer; // keep clean copy for bitcrush processing
    bitcrushAmount = 0;
    document.getElementById('bitcrushSlider').value = 0;
    document.getElementById('bitcrushVal').textContent = '0%';
    reverbBuffer = createReverbBuffer(audioCtx);
    buildGraph();
    playBtn.disabled = false;
    status.textContent = 'Ready — hit play';
    progressBar.value = 0;
    updateTimeDisplay(0);
    // Detect BPM in background
    const bpmDisplay = document.getElementById('bpmDisplay');
    bpmDisplay.style.display = 'block';
    bpmDisplay.textContent = 'BPM: detecting...';
    detectBPM(buffer).then(bpm => {
      detectedBPM = bpm;
      bpmDisplay.textContent = 'BPM: ' + bpm;
      document.getElementById('pulseBtn').disabled = false;
    });
  }

  function createReverbBuffer(ctx) {
    const len = ctx.sampleRate * 2.5;
    const rb = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = rb.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    return rb;
  }

  function muffleFreq(pct) {
    if (pct === 0) return 20000;
    return 20000 * Math.pow(300 / 20000, pct / 100);
  }

  function effectiveGain() {
    const base = userVolume * 2.0;
    const reverbBoost = (reverbAmount / 100) * 0.8;
    const muffleBoost = (muffleAmount / 100) * 0.8;
    return Math.min(base + reverbBoost + muffleBoost, 3.5);
  }

  function buildGraph() {
    gainNode = audioCtx.createGain();
    gainNode.gain.value = effectiveGain();

    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf';
    bassFilter.frequency.value = 150;
    bassFilter.gain.value = bassGain;

    muffleFilter = audioCtx.createBiquadFilter();
    muffleFilter.type = 'lowpass';
    muffleFilter.frequency.value = muffleFreq(muffleAmount);
    muffleFilter.Q.value = 0.5;

    delayNode = audioCtx.createDelay(2.0); delayNode.delayTime.value = 0.35;
    delayFeedback = audioCtx.createGain(); delayFeedback.gain.value = 0.45;
    delayWet = audioCtx.createGain(); delayWet.gain.value = delayAmount / 100;
    delayDry = audioCtx.createGain(); delayDry.gain.value = 1;

    convolverNode = audioCtx.createConvolver(); convolverNode.buffer = reverbBuffer;
    dryNode = audioCtx.createGain(); dryNode.gain.value = 1 - reverbAmount / 100;
    wetNode = audioCtx.createGain(); wetNode.gain.value = reverbAmount / 100;

    // Bitcrush node is a simple passthrough gain — actual processing is done offline
    // via resampleBitcrush() when the slider changes, which swaps the buffer
    bitcrushNode = audioCtx.createGain();
    bitcrushNode.gain.value = 1;

    gainNode.connect(bassFilter);
    bassFilter.connect(bitcrushNode);
    bitcrushNode.connect(muffleFilter);
    muffleFilter.connect(delayDry);
    muffleFilter.connect(delayNode);
    delayNode.connect(delayFeedback);
    delayFeedback.connect(delayNode);
    delayNode.connect(delayWet);
    delayDry.connect(dryNode); delayDry.connect(convolverNode);
    delayWet.connect(dryNode); delayWet.connect(convolverNode);
    convolverNode.connect(wetNode);
    dryNode.connect(audioCtx.destination);
    wetNode.connect(audioCtx.destination);
  }

  function startAudio(offset) {
    if (!buffer || !audioCtx) return;
    if (sourceNode) { try { sourceNode.disconnect(); sourceNode.stop(); } catch(e){} sourceNode = null; }
    buildGraph();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = buffer;
    sourceNode.playbackRate.value = speed;
    sourceNode.connect(gainNode);
    sourceNode.loop = loopEnabled;
    sourceNode.start(0, offset);
    startedAt = audioCtx.currentTime - offset / speed;
    isPlaying = true; playBtn.textContent = '⏸'; status.textContent = 'Playing';
    sourceNode.onended = () => {
      if (isPlaying && loopEnabled) {
        // Loop: reset progress bar and restart tracking
        startedAt = audioCtx.currentTime;
        pausedAt = 0;
        progressBar.value = 0;
        updateTimeDisplay(0);
        // sourceNode.loop handles actual audio looping, just reset tracking
        return;
      }
      if (isPlaying) {
        isPlaying = false; pausedAt = 0; playBtn.textContent = '▶';
        cancelAnimationFrame(animFrame); progressBar.value = 0;
        updateTimeDisplay(0); status.textContent = 'Ready — hit play';
      }
    };
    updateProgress();
  }

  function stopAudio() {
    isPlaying = false; cancelAnimationFrame(animFrame);
    if (sourceNode) { sourceNode.onended = null; try { sourceNode.stop(); } catch(e){} sourceNode = null; }
    playBtn.textContent = '▶';
  }

  function togglePlay() {
    if (!buffer) return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (isPlaying) { pausedAt = (audioCtx.currentTime - startedAt) * speed; stopAudio(); status.textContent = 'Paused'; }
    else startAudio(pausedAt);
  }

  progressBar.addEventListener('mousedown', () => { isSeeking = true; });
  progressBar.addEventListener('touchstart', () => { isSeeking = true; }, {passive:true});
  progressBar.addEventListener('change', () => { isSeeking = false; });

  function seek(val) {
    if (!buffer) return;
    const offset = (val / 100) * buffer.duration;
    pausedAt = offset; updateTimeDisplay(offset);
    if (isPlaying) { stopAudio(); startAudio(offset); }
  }

  function updateProgress() {
    if (!isPlaying || !buffer) return;
    const realElapsed = (audioCtx.currentTime - startedAt) * speed;
    const clamped = Math.min(realElapsed, buffer.duration);
    if (!isSeeking) progressBar.value = (clamped / buffer.duration * 100).toFixed(2);
    updateTimeDisplay(clamped);
    animFrame = requestAnimationFrame(updateProgress);
  }

  function updateTimeDisplay(elapsed) {
    const fmt = s => { const m = Math.floor(s/60); const sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; };
    const dur = buffer ? buffer.duration : 0;
    timeDisplay.textContent = fmt(Math.min(elapsed, dur)) + ' / ' + fmt(dur);
  }

  function updateVolume(val) {
    userVolume = parseInt(val) / 100;
    document.getElementById('volVal').textContent = val + '%';
    if (gainNode) gainNode.gain.value = effectiveGain();
  }

  function updateSpeed(val) {
    speed = parseFloat(val);
    document.getElementById('speedVal').textContent = speed.toFixed(2) + 'x';
    if (isPlaying && sourceNode) {
      const currentRealPos = (audioCtx.currentTime - startedAt) * speed;
      sourceNode.playbackRate.value = speed;
      startedAt = audioCtx.currentTime - currentRealPos / speed;
    }
    clearPresets();
  }

  function updateReverb(val) {
    reverbAmount = parseInt(val);
    document.getElementById('reverbVal').textContent = reverbAmount + '%';
    if (dryNode) dryNode.gain.value = 1 - reverbAmount / 100;
    if (wetNode) wetNode.gain.value = reverbAmount / 100;
    if (gainNode) gainNode.gain.value = effectiveGain();
    clearPresets();
  }

  function updateBass(val) {
    bassGain = parseInt(val);
    document.getElementById('bassVal').textContent = (bassGain >= 0 ? '+' : '') + bassGain + ' dB';
    if (bassFilter) bassFilter.gain.value = bassGain;
    clearPresets();
  }

  function updateMuffle(val) {
    muffleAmount = parseInt(val);
    document.getElementById('muffleVal').textContent = muffleAmount + '%';
    if (muffleFilter) muffleFilter.frequency.value = muffleFreq(muffleAmount);
    if (gainNode) gainNode.gain.value = effectiveGain();
    clearPresets();
  }

  function updateDelay(val) {
    delayAmount = parseInt(val);
    document.getElementById('delayVal').textContent = delayAmount + '%';
    if (delayWet) delayWet.gain.value = delayAmount / 100;
    clearPresets();
  }

  // Offline bitcrush: speed up by factor, then slow back down using OfflineAudioContext
  // This introduces aliasing artifacts that sound like real bitcrushing
  let originalBuffer = null; // always keep the clean original
  let bitcrushTimer = null;

  async function resampleBitcrush(pct) {
    if (!originalBuffer) return;
    // Capture real playback position to the tenth of a second
    if (isPlaying && audioCtx) {
      pausedAt = Math.round((audioCtx.currentTime - startedAt) * speed * 10) / 10;
    }
    const processStart = audioCtx ? audioCtx.currentTime : 0;
    if (pct === 0) { buffer = originalBuffer; if (isPlaying) { const pos = pausedAt; stopAudio(); startAudio(pos); } return; }

    status.textContent = 'Processing...';

    // Factor: at 100% we use 12x (heavy), at 1% we use 1.5x (subtle)
    const factor = 1 + (pct / 100) * 11;
    const sr = originalBuffer.sampleRate;
    const numCh = originalBuffer.numberOfChannels;
    const origLen = originalBuffer.length;

    // Step 1: render sped-up version at reduced effective sample rate
    const smallLen = Math.ceil(origLen / factor);
    const offCtx1 = new OfflineAudioContext(numCh, smallLen, sr);
    const src1 = offCtx1.createBufferSource();
    src1.buffer = originalBuffer;
    src1.playbackRate.value = factor;
    src1.connect(offCtx1.destination);
    src1.start();
    const fastBuf = await offCtx1.startRendering();

    // Step 2: render slowed back down to original length — this is where aliasing happens
    const offCtx2 = new OfflineAudioContext(numCh, origLen, sr);
    const src2 = offCtx2.createBufferSource();
    src2.buffer = fastBuf;
    src2.playbackRate.value = 1 / factor;
    src2.connect(offCtx2.destination);
    src2.start();
    const crushedBuf = await offCtx2.startRendering();

    buffer = crushedBuf;
    status.textContent = isPlaying ? 'Playing' : 'Ready — hit play';

    // Add processing time so resume feels seamless
    const processingElapsed = audioCtx ? (audioCtx.currentTime - processStart) : 0;
    const resumePos = Math.min(pausedAt + processingElapsed, buffer.duration - 0.01);
    const wasPlaying = isPlaying;
    if (wasPlaying) stopAudio();
    pausedAt = resumePos;
    if (wasPlaying) startAudio(resumePos);
  }

  function updateBitcrush(val) {
    bitcrushAmount = parseInt(val);
    document.getElementById('bitcrushVal').textContent = bitcrushAmount + '%';
    clearPresets();
    // Debounce so we don't reprocess on every slider tick
    clearTimeout(bitcrushTimer);
    bitcrushTimer = setTimeout(() => resampleBitcrush(bitcrushAmount), 400);
  }

  let savedPresets = JSON.parse(localStorage.getItem('lc_presets') || '[]');

  function getCurrentValues() {
    return {
      speed: parseFloat(document.getElementById('speedSlider').value),
      reverb: parseInt(document.getElementById('reverbSlider').value),
      bass: parseInt(document.getElementById('bassSlider').value),
      muffle: parseInt(document.getElementById('muffleSlider').value),
      delay: parseInt(document.getElementById('delaySlider').value),
      bitcrush: parseInt(document.getElementById('bitcrushSlider').value),
      volume: parseInt(document.getElementById('volumeSlider').value),
    };
  }

  function applyValues(p) {
    document.getElementById('speedSlider').value = p.speed;
    document.getElementById('reverbSlider').value = p.reverb;
    document.getElementById('bassSlider').value = p.bass;
    document.getElementById('muffleSlider').value = p.muffle;
    document.getElementById('delaySlider').value = p.delay;
    document.getElementById('bitcrushSlider').value = p.bitcrush;
    if (p.volume !== undefined) { document.getElementById('volumeSlider').value = p.volume; updateVolume(p.volume); }
    updateSpeed(p.speed); updateReverb(p.reverb); updateBass(p.bass);
    updateMuffle(p.muffle); updateDelay(p.delay); updateBitcrush(p.bitcrush);
  }

  function resetSliders() {
    applyValues({ speed: 1, reverb: 0, bass: 0, muffle: 0, delay: 0, bitcrush: 0, volume: 50 });
    clearPresets();
  }

  function savePreset() {
    const name = prompt('Name this preset:');
    if (!name || !name.trim()) return;
    const preset = { name: name.trim(), values: getCurrentValues() };
    savedPresets.push(preset);
    try { localStorage.setItem('lc_presets', JSON.stringify(savedPresets)); } catch(e) {}
    renderSavedPresets();
  }

  function deletePreset(idx) {
    savedPresets.splice(idx, 1);
    try { localStorage.setItem('lc_presets', JSON.stringify(savedPresets)); } catch(e) {}
    renderSavedPresets();
  }

  function renderSavedPresets() {
    const row = document.getElementById('presetsRow');
    // Remove old saved preset buttons
    row.querySelectorAll('.saved-preset').forEach(b => b.remove());
    savedPresets.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn saved-preset';
      btn.innerHTML = p.name + '<span class="del" onclick="event.stopPropagation();deletePreset(' + i + ')">✕</span>';
      btn.onclick = () => { applyValues(p.values); clearPresets(); btn.classList.add('active'); };
      row.appendChild(btn);
    });
  }

  function clearPresets() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  }

  // Loop toggle
  let loopEnabled = false;
  function toggleLoop() {
    loopEnabled = !loopEnabled;
    const btn = document.getElementById('loopBtn');
    btn.classList.toggle('active', loopEnabled);
    if (sourceNode) sourceNode.loop = loopEnabled;
  }

  // BPM detection using energy-based onset detection
  let detectedBPM = 120;
  async function detectBPM(buf) {
    const sr = buf.sampleRate;
    const data = buf.getChannelData(0);
    const windowSize = Math.floor(sr * 0.01); // 10ms windows
    const energies = [];
    for (let i = 0; i < data.length - windowSize; i += windowSize) {
      let e = 0;
      for (let j = 0; j < windowSize; j++) e += data[i+j] * data[i+j];
      energies.push(e / windowSize);
    }
    // Find peaks in energy
    const threshold = energies.reduce((a,b) => a+b, 0) / energies.length * 1.5;
    const peaks = [];
    const minGap = Math.floor(sr * 0.3 / windowSize); // min 300ms between beats
    let lastPeak = -minGap;
    for (let i = 1; i < energies.length - 1; i++) {
      if (energies[i] > threshold && energies[i] > energies[i-1] && energies[i] > energies[i+1] && i - lastPeak > minGap) {
        peaks.push(i);
        lastPeak = i;
      }
    }
    if (peaks.length < 4) return 120;
    // Average interval between peaks
    const intervals = [];
    for (let i = 1; i < Math.min(peaks.length, 32); i++) {
      intervals.push((peaks[i] - peaks[i-1]) * windowSize / sr);
    }
    const avgInterval = intervals.reduce((a,b) => a+b, 0) / intervals.length;
    const bpm = Math.round(60 / avgInterval);
    // Normalize to 60-180 range
    let b = bpm;
    while (b < 60) b *= 2;
    while (b > 180) b /= 2;
    return b;
  }

  // Pulse: fade underwater in over 16 beats (slow), out over 4 beats (fast)
  let pulseEnabled = false;
  let pulseRaf = null;
  let pulseStartTime = null;
  let pulsePhase = 'in'; // 'in' or 'out'
  let pulsePhaseStart = null;

  function togglePulse() {
    pulseEnabled = !pulseEnabled;
    const btn = document.getElementById('pulseBtn');
    btn.classList.toggle('active', pulseEnabled);
    if (pulseEnabled) {
      pulsePhase = 'in';
      pulsePhaseStart = performance.now();
      runPulse();
    } else {
      cancelAnimationFrame(pulseRaf);
      // Reset underwater to 0
      document.getElementById('muffleSlider').value = 0;
      updateMuffle(0);
    }
  }

  function runPulse() {
    if (!pulseEnabled) return;
    const now = performance.now();
    // BPM adjusted for playback speed
    const effectiveBPM = detectedBPM * speed;
    const beatMs = (60 / effectiveBPM) * 1000;
    // 16 beats fade in, 4 beats fade out
    const inDuration = beatMs * 16;
    const outDuration = beatMs * 4;

    const elapsed = now - pulsePhaseStart;
    let muffleVal;

    if (pulsePhase === 'in') {
      muffleVal = Math.min((elapsed / inDuration) * 100, 100);
      if (elapsed >= inDuration) {
        pulsePhase = 'out';
        pulsePhaseStart = now;
      }
    } else {
      muffleVal = Math.max(100 - (elapsed / outDuration) * 100, 0);
      if (elapsed >= outDuration) {
        pulsePhase = 'in';
        pulsePhaseStart = now;
      }
    }

    // Snap to step of 5
    muffleVal = Math.round(muffleVal / 5) * 5;
    document.getElementById('muffleSlider').value = muffleVal;
    updateMuffle(muffleVal);

    pulseRaf = requestAnimationFrame(runPulse);
  }

  // Load saved presets on init
  renderSavedPresets();

  // v → f → v morph animation on the logo
  (function morphLogo() {
    const fromEl = document.querySelector('.morph-letter .from');
    const toEl = document.querySelector('.morph-letter .to');
    if (!fromEl || !toEl) return;
    function showF() {
      fromEl.style.opacity = '0';
      toEl.style.opacity = '1';
      setTimeout(showV, 1800);
    }
    function showV() {
      fromEl.style.opacity = '1';
      toEl.style.opacity = '0';
      setTimeout(showF, 3500);
    }
    setTimeout(showF, 3500);
  })();
</script>
</body>
